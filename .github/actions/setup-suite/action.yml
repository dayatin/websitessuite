name: "Setup Suite Environment"
description: "Sets up Node.js, pnpm, and caches pnpm dependencies across the monorepo"

inputs:
  node-version:
    description: "Node.js version to use"
    required: false
    default: "22.x"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 10.5.2
        run_install: false

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Add node_modules/.bin to PATH
      shell: bash
      run: echo "${{ github.workspace }}/node_modules/.bin" >> $GITHUB_PATH

    - name: Configure Node flags for TypeScript execution
      shell: bash
      run: echo "NODE_OPTIONS=--experimental-strip-types --no-warnings" >> $GITHUB_ENV
